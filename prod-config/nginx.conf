resolver 127.0.0.11 valid=10s ipv6=off;

upstream cms_backend {
    zone cms_backend 64k;
    server cms:1337 resolve;
}

upstream frontend_backend {
    zone frontend_backend 64k;
    server frontend:3000 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_origin $main_origin_allowed {
    default 0;
    '' 1;
    'https://${DOMAIN}' 1;
    'https://www.${DOMAIN}' 1;
}

map $http_origin $admin_origin_allowed {
    default 0;
    '' 1;
    'https://${ADMIN_DOMAIN}' 1;
}

map $request_uri $encoded_path_attempt {
    default 0;
    ~*%(00|25|2e|2f|5c) 1;
}

map $status $security_event {
    default 0;
    ~^(400|401|403|404|405|413|429)$ 1;
}

limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=public_api_connections:10m;
limit_req_status 429;
limit_conn_status 429;

log_format security '$remote_addr host=$host request="$request" status=$status '
                    'origin="$http_origin" request_id=$request_id';
access_log /dev/stderr security if=$security_event;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} www.${DOMAIN} ${ADMIN_DOMAIN};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/active/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/active/privkey.pem;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN} www.${DOMAIN};

    ssl_certificate /etc/letsencrypt/active/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/active/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    if ($main_origin_allowed = 0) {
        return 403;
    }
    if ($encoded_path_attempt = 1) {
        return 400;
    }

    location = /_health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location = /api {
        return 404;
    }

    location ^~ /api/ {
        limit_except GET {
            deny all;
        }

        limit_req zone=public_api burst=20 nodelay;
        limit_conn public_api_connections 20;

        proxy_connect_timeout 15s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://frontend_backend;
    }

    location ^~ /uploads/ {
        limit_except GET {
            deny all;
        }

        proxy_connect_timeout 15s;
        proxy_read_timeout 15s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://cms_backend;
    }

    location ~* ^/(admin|content-manager|content-type-builder|upload|users-permissions|i18n|email|graphql|documentation|transfer|webhooks|plugins?)(/|$) {
        return 404;
    }

    location / {
        limit_except GET {
            deny all;
        }

        proxy_connect_timeout 15s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://frontend_backend;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${ADMIN_DOMAIN};

    ssl_certificate /etc/letsencrypt/active/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/active/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 16m;

    if ($admin_origin_allowed = 0) {
        return 403;
    }
    if ($encoded_path_attempt = 1) {
        return 400;
    }

    location = / {
        return 302 /admin;
    }

    location = /api {
        return 404;
    }

    location ^~ /api/ {
        return 404;
    }

    location / {
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://cms_backend;
    }
}
